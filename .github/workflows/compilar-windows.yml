name: Compilar jogo e instalador

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Instalar ferramenta de empacotamento
        run: choco install innosetup --yes --no-progress
      - name: Gerar jogo e instalador
        shell: pwsh
        run: ./instalador/gerar-instalador.ps1
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-TrilhasDaMemoria
          path: entrega/instalador/*.exe
          if-no-files-found: error
